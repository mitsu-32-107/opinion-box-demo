<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学生意見箱ポータル</title>
  <style>
    :root { --primary-color: #2563eb; --bg-color: #f1f5f9; --card-bg: #ffffff; --text-main: #1e293b; }
    body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; }
    .header { background-color: var(--primary-color); color: white; padding: 20px; text-align: center; }
    .header h1 { margin: 0; font-size: 1.5rem; }
    .container { max-width: 800px; margin: 20px auto; padding: 0 20px; }
    .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #cbd5e1; }
    .tab { padding: 10px 20px; cursor: pointer; font-weight: bold; color: #64748b; }
    .tab.active { color: var(--primary-color); border-bottom: 3px solid var(--primary-color); margin-bottom: -2px; }
    
    /* 投稿フォームのスタイル */
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 8px; }
    .form-control { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; font-family: inherit; }
    textarea.form-control { height: 120px; resize: vertical; }
    .submit-btn { background-color: var(--primary-color); color: white; border: none; padding: 12px 24px; border-radius: 4px; cursor: pointer; font-size: 1rem; font-weight: bold; width: 100%; }
    
    /* 意見カードのスタイル */
    .opinion-card { background-color: var(--card-bg); border-radius: 8px; padding: 20px; margin-bottom: 16px; border-left: 5px solid var(--primary-color); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .tag { font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; font-weight: bold; display: inline-block; margin-right: 8px; margin-bottom: 8px; }
    .tag-target { background-color: #dbeafe; color: #1e40af; }
    .tag-category { background-color: #f3e8ff; color: #6b21a8; }
    .opinion-body { font-size: 1rem; line-height: 1.6; white-space: pre-wrap; margin: 12px 0; }
    .reply-box { background-color: #eff6ff; border: 1px solid #bfdbfe; padding: 16px; border-radius: 4px; margin-top: 16px; font-size: 0.95rem; }
    .opinion-meta { font-size: 0.85rem; color: #64748b; margin-top: 12px; border-top: 1px dashed #cbd5e1; padding-top: 12px; }
  </style>
</head>
<body>
  <header class="header">
    <h1>📝 学生意見箱ポータル</h1>
    <p style="margin: 8px 0 0 0; font-size: 0.9rem;">あなたの声で、大学をより良くしよう</p>
  </header>

  <div class="container">
    <div class="tabs">
      <div class="tab active" id="tab-submit" onclick="switchTab('submit')">意見を投稿する</div>
      <div class="tab" id="tab-public" onclick="switchTab('public')">公開された回答を見る</div>
    </div>

    <!-- 投稿用フォーム -->
    <div id="view-submit">
      <div style="background: white; padding: 24px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
        <div class="form-group">
          <label>宛先（誰に届けたいですか？）</label>
          <select id="input-target" class="form-control">
            <option value="学友会執行委員会">学友会執行委員会</option>
            <option value="大学教務課（授業・成績など）">大学教務課（授業・成績など）</option>
            <option value="学生支援課（奨学金・生活など）">学生支援課（奨学金・生活など）</option>
            <option value="施設管理課（設備・清掃など）">施設管理課（設備・清掃など）</option>
          </select>
        </div>
        <div class="form-group">
          <label>カテゴリー</label>
          <select id="input-category" class="form-control">
            <option value="要望・提案">要望・提案</option>
            <option value="質問・確認">質問・確認</option>
            <option value="不満・トラブル">不満・トラブル</option>
            <option value="その他">その他</option>
          </select>
        </div>
        <div class="form-group">
          <label>意見の内容</label>
          <textarea id="input-content" class="form-control" placeholder="ここに具体的な意見や要望を記入してください..."></textarea>
        </div>
        <div class="form-group" style="display: flex; gap: 12px;">
          <div style="flex: 1;">
            <label>学年（任意）</label>
            <input type="text" id="input-grade" class="form-control" placeholder="例: 2年">
          </div>
          <div style="flex: 1;">
            <label>氏名（任意・非公開）</label>
            <input type="text" id="input-name" class="form-control" placeholder="例: 千葉 太郎">
          </div>
        </div>
        <button class="submit-btn" onclick="submitOpinion()">意見を送信する</button>
      </div>
    </div>

    <!-- 公開された回答一覧 -->
    <div id="view-public" style="display: none;">
      <div id="public-list"></div>
    </div>
  </div>

  <script>
    function switchTab(tabName) {
      document.getElementById('tab-submit').classList.remove('active');
      document.getElementById('tab-public').classList.remove('active');
      document.getElementById('view-submit').style.display = 'none';
      document.getElementById('view-public').style.display = 'none';

      document.getElementById(`tab-${tabName}`).classList.add('active');
      document.getElementById(`view-${tabName}`).style.display = 'block';

      if(tabName === 'public') {
        renderPublicOpinions();
      }
    }

    function submitOpinion() {
      const target = document.getElementById('input-target').value;
      const category = document.getElementById('input-category').value;
      const content = document.getElementById('input-content').value;
      const grade = document.getElementById('input-grade').value || "未入力";
      const name = document.getElementById('input-name').value || "匿名希望";

      if (!content.trim()) {
        alert("意見の内容を入力してください！");
        return;
      }

      let opinions = JSON.parse(localStorage.getItem('appOpinionsData')) || [];
      
      const newOpinion = {
        id: Date.now(),
        date: new Date().toLocaleDateString('ja-JP'),
        target: target,
        category: category,
        content: content,
        grade: grade,
        name: name,
        email: "※学生画面からはメールアドレス収集を省略",
        status: "未処理（確認待ち）",
        replyText: "",
        history: [{ time: new Date().toLocaleString('ja-JP'), action: "学生から意見が投稿されました", detail: "" }]
      };

      opinions.push(newOpinion);
      localStorage.setItem('appOpinionsData', JSON.stringify(opinions));

      alert("意見を送信しました！厚生部が確認し、必要な部署へ共有します。");
      
      // フォームをリセット
      document.getElementById('input-content').value = "";
      document.getElementById('input-grade').value = "";
      document.getElementById('input-name').value = "";
    }

    function renderPublicOpinions() {
      const opinions = JSON.parse(localStorage.getItem('appOpinionsData')) || [];
      const listContainer = document.getElementById('public-list');
      listContainer.innerHTML = ""; 

      // ステータスが「公開済み」のものだけを抽出して新しい順に並べる
      let publicOpinions = opinions.filter(op => op.status === "公開済み").reverse();

      if(publicOpinions.length === 0) {
        listContainer.innerHTML = `<p style="text-align:center; color:#64748b; margin-top: 40px;">現在、公開されている回答はありません。</p>`;
        return;
      }

      publicOpinions.forEach(op => {
        const card = document.createElement('div');
        card.className = 'opinion-card';
        
        // ★ 深夜対応問題対策：時刻は表示せず「日付のみ」を表示する
        let publishDateHtml = op.publishDate ? `<div style="font-size: 0.85rem; color: var(--primary-color); font-weight: bold; margin-bottom: 8px;">🗓 回答公開日: ${op.publishDate}</div>` : "";

        card.innerHTML = `
          <div>
            <span class="tag tag-target">宛先: ${op.target}</span>
            <span class="tag tag-category">${op.category}</span>
          </div>
          <div class="opinion-body">${op.content}</div>
          <div class="opinion-meta">
            投稿日: ${op.date} &nbsp;|&nbsp; 投稿者: ${op.grade} (※氏名は非公開です)
          </div>
          <div class="reply-box">
            ${publishDateHtml}
            <strong>【回答】</strong><br>${op.replyText}
          </div>
        `;
        listContainer.appendChild(card);
      });
    }
  </script>
</body>
</html>
